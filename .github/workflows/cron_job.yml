name: Hourly TQQQ Paper Bot

on:
  schedule:
    # Runs every hour from 13:00 to 21:00 UTC (covers 9:30 AM - 4:00 PM ET in both EST and EDT)
    - cron: '0 13-21 * * 1-5'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy alpaca-py requests

      - name: Run Bot Directly
        env:
          API_KEY: ${{ secrets.APCA_API_KEY_ID }}
          SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APO_API_KEY: ${{ secrets.APO_API_KEY }}
          APO_API_SECRET: ${{ secrets.APO_API_SECRET }}
        run: python bot.py
